name: Daily sync and GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # UTC 00:17 = Asia/Taipei 08:17; off the busy top of the hour.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    outputs:
      degraded: ${{ steps.sync.outputs.degraded }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Check out previous successful snapshots
        uses: actions/checkout@v6
        with:
          ref: data/snapshots
          path: .snapshots
      - name: Restore snapshots and request state
        run: |
          rsync -a --delete .snapshots/data/sources/ data/sources/
          cp .snapshots/public/data/dashboard.json public/data/dashboard.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Test data and date logic
        run: npm test
      - name: Sync records and daily public profiles
        id: sync
        env:
          QOJ_COOKIE: ${{ secrets.QOJ_COOKIE }}
          QOJ_USERNAME: ${{ secrets.QOJ_USERNAME }}
          QOJ_PASSWORD: ${{ secrets.QOJ_PASSWORD }}
          QOJ_HANDLE: ${{ vars.QOJ_HANDLE }}
        run: python3 scripts/sync.py
      - name: Preserve snapshots for the next sync
        if: always() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure')
        run: |
          rsync -a --delete data/sources/ .snapshots/data/sources/
          cp public/data/dashboard.json .snapshots/public/data/dashboard.json
          git -C .snapshots config user.name "github-actions[bot]"
          git -C .snapshots config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .snapshots add -- data/sources public/data/dashboard.json
          if ! git -C .snapshots diff --cached --quiet; then
            git -C .snapshots commit -m "data: refresh OJFlare snapshots"
            git -C .snapshots push origin HEAD:refs/heads/data/snapshots
          fi
      - name: Build static site
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report stale source after deploying the retained records
        if: needs.build.outputs.degraded == 'true'
        run: |
          echo 'A data source failed. The site was deployed with the last successful snapshot and a visible warning. See the sync step.'
          exit 1
